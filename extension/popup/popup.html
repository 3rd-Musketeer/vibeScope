<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Research Assistant</title>
  <style>
    body {
      width: 280px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      text-align: center;
      margin: 0;
    }
    
    .logo {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    
    p {
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    
    .open-panel-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    
    .open-panel-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    
    .version {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="logo">🔍</div>
  <h1>Research Assistant</h1>
  <p>Capture and analyze social media content for research purposes.</p>
  
  <button id="open-panel-btn" class="open-panel-btn">
    Open Side Panel
  </button>
  
  <div class="version">v1.0.0</div>
  
  <script src="popup.js"></script>
</body>
</html>
