<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vibeScope</title>
  <link rel="stylesheet" href="../extension.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-logo">🔍</div>
      <h1 class="popup-title">Research Assistant</h1>
      <p class="popup-subtitle">Enter your project token to start capturing content</p>
    </div>

    <div class="key-input-group">
      <div class="key-input-container">
        <input 
          type="password" 
          id="project-key" 
          class="input"
          placeholder="Paste your project token here..."
          autocomplete="off"
        >
        <button type="button" id="toggle-visibility" class="key-toggle">👁️</button>
      </div>
    </div>

    <div id="connection-status" class="connection-status" style="display: none;"></div>

    <button id="start-scraping" class="btn btn-primary w-full mb-4" disabled>
      Connect & Start Scraping
    </button>

    <div class="text-center text-xs text-muted">v1.0.0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
