<!DOCTYPE html>
<html>
<head>
    <title>Create Extension Icons</title>
</head>
<body>
    <h1>Extension Icon Generator</h1>
    <p>This page will generate the required extension icons. Open in browser and save the generated images.</p>
    
    <div id="icons"></div>
    
    <script>
        // Create canvas-based icons
        function createIcon(size, filename) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#007bff';
            ctx.fillRect(0, 0, size, size);
            
            // Search icon (magnifying glass)
            const centerX = size / 2;
            const centerY = size / 2 - size * 0.1;
            const radius = size * 0.25;
            
            // Circle
            ctx.beginPath();
            ctx.arc(centerX - size * 0.05, centerY - size * 0.05, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.08;
            ctx.stroke();
            
            // Handle
            ctx.beginPath();
            ctx.moveTo(centerX + radius * 0.5, centerY + radius * 0.5);
            ctx.lineTo(centerX + radius * 1.2, centerY + radius * 1.2);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.08;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // Create download link
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.textContent = `Download ${filename} (${size}x${size})`;
            link.style.display = 'block';
            link.style.margin = '10px 0';
            
            const container = document.createElement('div');
            container.appendChild(canvas);
            container.appendChild(link);
            
            return container;
        }
        
        // Generate all required sizes
        const iconsContainer = document.getElementById('icons');
        iconsContainer.appendChild(createIcon(16, 'icon16.png'));
        iconsContainer.appendChild(createIcon(48, 'icon48.png'));
        iconsContainer.appendChild(createIcon(128, 'icon128.png'));
        
        console.log('Icons generated! Right-click each download link and save the files to the icons/ directory.');
    </script>
</body>
</html>
