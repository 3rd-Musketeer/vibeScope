<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vibeScope</title>
  <link rel="stylesheet" href="../extension.css">
</head>
<body>
  <div class="sidepanel-container">
    <!-- Header -->
    <div class="sidepanel-header">
      <h1 class="sidepanel-title">🔍 Content Scraper</h1>
      <div class="flex items-center gap-2">
        <div id="status-dot" class="status-dot connected"></div>
        <span class="text-xs text-secondary">Ready</span>
      </div>
    </div>

    <!-- Capture Method Selection -->
    <div class="capture-section">
      <h2 class="section-title">Choose Capture Method</h2>
      <div class="radio-group">
        <label class="radio-item" data-method="full-page">
          <input type="radio" name="capture-method" value="full-page" checked>
          <div>
            <div class="font-medium">📄 Full Page</div>
            <div class="text-xs text-secondary">Capture entire webpage HTML</div>
          </div>
        </label>
        
        <label class="radio-item" data-method="element-select">
          <input type="radio" name="capture-method" value="element-select">
          <div>
            <div class="font-medium">🎯 Select Element</div>
            <div class="text-xs text-secondary">Choose specific elements to capture</div>
          </div>
        </label>
      </div>
    </div>

    <!-- Action Button -->
    <button id="capture-btn" class="btn btn-primary w-full mb-4">
      📸 Capture Full Page
    </button>

    <!-- Preview Area -->
    <div id="preview-section" style="display: none;">
      <h2 class="section-title">Content Preview</h2>
      <div class="preview-area">
        <div id="preview-content" class="preview-content">
          <div class="text-sm text-muted">Captured content will appear here</div>
        </div>
      </div>
      
      <div id="preview-meta" class="preview-meta" style="display: none;">
        <div class="text-xs">
          <div><strong>Title:</strong> <span id="page-title"></span></div>
          <div><strong>URL:</strong> <span id="page-url"></span></div>
          <div><strong>Size:</strong> <span id="content-size"></span></div>
        </div>
      </div>

      <button id="submit-btn" class="btn btn-primary w-full" disabled>
        📤 Send to Server
      </button>
    </div>

    <!-- Status -->
    <div id="status-text" class="status-text">Ready to capture content</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
