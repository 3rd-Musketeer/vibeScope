[tool.setuptools.packages.find]
exclude = [
    "dev_docs",
    "logs",
    "data",
    "static",
    "legacy",
    "scripts",
    "tests",
    ".venv",
    ".claude",
    ".ruff_cache",
    "__pycache__",
    "node_modules",
    "dist",
    "build"
]

[project]
name = "vibeScope-server"
version = "0.1.0"
description = "Social media sentiment analysis and research tool backend"
requires-python = ">=3.9"
dependencies = [
    "crawl4ai>=0.7.2",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "instructor>=1.10.0",
    "openai>=1.98.0",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "tinydb>=4.8.2",
    "uvicorn>=0.35.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".nox", ".pants.d", ".pytype",
    ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out",
    "build", "dist", "node_modules", "venv",
    "data", "static", "legacy"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
]

ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults (FastAPI pattern)
    "B904", # raise from exception (FastAPI HTTPException pattern)
    "S101", # use of assert (common in tests)
    "S104", # binding to all interfaces (common in development)
    "S112", # try-except-continue (acceptable pattern)
    "N806", # variable name should be lowercase (for FastAPI Response models)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"test_*.py" = ["S101"]    # allow assert in tests
"*_test.py" = ["S101"]    # allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[project.optional-dependencies]
dev = [
    "ruff>=0.12.7",
]
